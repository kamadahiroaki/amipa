# GitHub Actions: イメージを焼いて GHCR へ置く。
#
#   v0.1.0 のようなタグを打つと    → ghcr.io/<owner>/amipa-{prep,viewer}:v0.1.0 と :latest
#   main へ push すると            → :main（動作確認用。latest は動かさない）
#   手で実行（workflow_dispatch）  → :main と同じ扱い
#
# ここで焼くのは Docker イメージだけ。Apptainer で使う場合は利用者が
#   apptainer pull amipa-viewer.sif docker://ghcr.io/<owner>/amipa-viewer:<tag>
# で引く（docs/install.md）。
#
# ★ローカルの docker で焼いたものと同じにするため、ビルドは docker/Dockerfile.* を
#   そのまま使い、context もリポジトリのルートのままにしてある（.dockerignore が効く）。
name: images

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # prep が落ちても viewer の結果は見たい
      matrix:
        image: [viewer, prep]   # viewer は 3-5 分、prep は 15-25 分
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグの決め方は docker/metadata-action に任せる。
      #   v タグ → そのタグ + semver の短縮 + latest / main への push → main
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/amipa-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 版の刻印。渡さないと amipa version が unknown になる（docs/install.md）
          build-args: |
            AMIPA_REV=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # イメージの最終段に自己テストが入っているので、ここまで来た時点で
      # 共有ライブラリの取りこぼしは無い。念のため入口だけ叩いて版を出す。
      - name: 起動を確かめる
        run: |
          IMG=$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -1)
          docker run --rm "$IMG" version
          docker run --rm "$IMG" licenses | head -20
