#cloud-config
# Azure VM の初期化。`az vm create --custom-data cloud-init.yaml` で渡す。
#   ・Docker を入れる
#   ・データディスク(LUN 0)を ext4 で /data にマウントする（**既存データがあれば消さない**）
#   ・/opt/ggb を作り、systemd で compose を起動できるようにする
# compose.yml / Caddyfile / .env は作成後に scp で置く（README 参照）。

package_update: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - rsync
  - jq

write_files:
  - path: /usr/local/sbin/ggb-mount-data
    permissions: "0755"
    content: |
      #!/bin/bash
      # データディスクを /data にマウントする（初回だけ mkfs）。
      # ★既にファイルシステムがあれば絶対に mkfs しない（DB を消さないため）。
      set -euo pipefail
      DEV=/dev/disk/azure/scsi1/lun0
      for i in {1..30}; do [[ -e $DEV ]] && break; sleep 2; done
      [[ -e $DEV ]] || { echo "data disk not found: $DEV"; exit 0; }
      if ! blkid "${DEV}" >/dev/null 2>&1 && ! blkid "${DEV}1" >/dev/null 2>&1; then
        echo "formatting $DEV (first boot)"
        mkfs.ext4 -L ggbdata -m 0 "$DEV"
      fi
      TARGET="$DEV"; blkid "${DEV}1" >/dev/null 2>&1 && TARGET="${DEV}1"
      mkdir -p /data
      grep -q ' /data ' /etc/fstab || \
        echo "$(blkid -o export "$TARGET" | grep ^UUID=) /data ext4 defaults,noatime,nofail 0 2" >> /etc/fstab
      mount -a
      mkdir -p /data/bundles
      chmod 0755 /data /data/bundles

  - path: /etc/systemd/system/ggb.service
    content: |
      [Unit]
      Description=ggb viewer (docker compose)
      Requires=docker.service
      After=docker.service data.mount
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/ggb
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down
      TimeoutStartSec=0
      [Install]
      WantedBy=multi-user.target

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - /usr/local/sbin/ggb-mount-data
  - mkdir -p /opt/ggb
  - usermod -aG docker azureuser || true
  - systemctl daemon-reload
  # ggb.service は compose.yml を置いてから有効化する: systemctl enable --now ggb
