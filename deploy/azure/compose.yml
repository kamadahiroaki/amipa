# Azure VM 上の amipa 公開インスタンス（viewer + Caddy）。
#   /opt/amipa/ に compose.yml / Caddyfile / .env を置いて `docker compose up -d`。
#
# 設計:
#   ・viewer はホストにポートを晒さない（caddy からのみ到達）。443/80 だけ開ける。
#   ・DB は :ro マウント。さらに AMIPA_READONLY=1 でアプリ側でも書き込み経路を塞ぐ（二重）。
#   ・書き込み先はセッション用ボリュームだけ（パーマリンク `?s=` を残すため）。
services:
  viewer:
    image: ${AMIPA_IMAGE:?set AMIPA_IMAGE in .env}
    restart: unless-stopped
    expose:
      - "3001"
    volumes:
      - ${AMIPA_DATA:-/data/bundles}:/data:ro
      - amipa-sessions:/var/lib/ggb/sessions
    environment:
      DB_DIR: /data
      PORT: "3001"
      AMIPA_READONLY: "1"
      AMIPA_CACHE_MB: "${AMIPA_CACHE_MB:-512}"
      AMIPA_DB_WORKERS: "${AMIPA_DB_WORKERS:-4}"
      AMIPA_MAX_ROWS: "${AMIPA_MAX_ROWS:-400000}"
      AMIPA_FETCH_MS: "${AMIPA_FETCH_MS:-20000}"
      AMIPA_PREWARM: "${AMIPA_PREWARM:-}"
      AMIPA_VERSION: "${AMIPA_IMAGE}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data           # 証明書（消すと Let's Encrypt を取り直す）
      - caddy-config:/config
    environment:
      AMIPA_DOMAIN: ${AMIPA_DOMAIN:?set AMIPA_DOMAIN in .env}
      AMIPA_ACME_EMAIL: ${AMIPA_ACME_EMAIL:?set AMIPA_ACME_EMAIL in .env}
    depends_on:
      - viewer
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  amipa-sessions:
  caddy-data:
  caddy-config:
