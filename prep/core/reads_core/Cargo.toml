[package]
name = "reads_core"
version = "0.1.0"
edition = "2021"
# 案B(オンデマンド reads)の DB 付与 hot path を所有する Rust core。
# GAF パス走査(点4=単スレ Python 律速)と edge_sup 集計(点2=Python dict 15-30GB)を
# 高速・compact 化し、read_node を rusqlite で直書き。BGZF 書込/voff は Python(Bio.bgzf)のまま
# = voff 互換リスクを負わない。emit_core と同流儀(PyO3 + maturin, rusqlite bundled)。

[lib]
name = "reads_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
