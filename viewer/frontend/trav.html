<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMIPA traversals (試作)</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 12px/1.4 system-ui, sans-serif; background: #fafafa; color: #222; }
  #bar { display: flex; gap: 10px; align-items: center; padding: 6px 10px; background: #fff; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
  #bar label { color: #555; }
  #bar input[type=number] { width: 70px; }
  #info { color: #444; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
  #wrap { position: relative; }
  canvas { display: block; }
  #tip { position: fixed; pointer-events: none; background: rgba(30,30,30,.92); color: #fff; padding: 4px 7px; border-radius: 3px; font-size: 11px; display: none; max-width: 420px; white-space: pre; z-index: 9; }
  button { font: inherit; }
</style>
</head>
<body>
<div id="bar">
  <label>DB <select id="db"></select></label>
  <label>錨の床 <input id="minanch" type="number" value="50" min="0" step="10"></label>
  <button id="all">全体</button><button id="back">戻る</button>
  <label><input id="showcopies" type="checkbox" checked> コピー</label>
  <label><input id="showreps" type="checkbox" checked> 反復</label>
  <label><input id="showbounds" type="checkbox" checked> 境界</label>
  <span id="info"></span>
</div>
<div id="wrap"><canvas id="cv"></canvas><div id="tip"></div></div>
<script type="module" src="/src/trav/main.ts"></script>
</body>
</html>
